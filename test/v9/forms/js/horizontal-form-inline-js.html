<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Form (Inline Flavor)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="p-8 bg-gray-50 flex flex-col gap-8 max-w-6xl mx-auto mb-20">
    <a href="./index.html" class="text-blue-500 hover:underline">&larr; Back to JS Forms Index</a>

    <div>
        <h3 class="text-lg font-medium text-gray-700 mb-4">Inline / Minimal Form Layout</h3>
        <p class="text-sm text-gray-500 mb-6">This form uses <code>ks-layout="inline"</code>. Notice how the header,
            body rows, and footer button all sit on a single line to save vertical space!</p>
        <div id="inline-container" class="bg-white p-6 rounded shadow border">
            <!-- Form will be injected here -->
        </div>
    </div>

    <script type="module" src="../../../../index.js"></script>
    <script type="module">
        const container = document.getElementById("inline-container");

        // Schema for just two inputs
        const formSchema = [
            {
                theme: "split-30-70",
                order: "label,input",
                labelText: "Name",
                inputType: "text",
                inputPlaceholder: "Enter name..."
            },
            {
                theme: "split-30-70",
                order: "label,input",
                labelText: "Email",
                inputType: "email",
                inputPlaceholder: "Enter email..."
            }
        ];

        const form = document.createElement("ks-horizontal-form");
        console.log("form : ", form);

        form._options = formSchema;

        // Header and Footer
        form._header = "Search:";
        form._footer = [
            { text: "Find User" } // The theme will automatically style this!
        ];

        // Switch to the new inline theme!
        form.setAttribute("ks-theme", "inline");

        container.appendChild(form);
    </script>
</body>

</html>
