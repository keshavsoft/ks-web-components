<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Behaviors & Constraints Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 p-8 font-sans">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-lg border border-gray-100">
        <h1 class="text-3xl font-extrabold text-gray-900 mb-2">HTML Control Behaviors Showcase</h1>
        <p class="text-gray-500 mb-8 text-lg">Interactive story-based reference for native HTML input attributes & constraints.</p>

        <form onsubmit="event.preventDefault(); alert('Form submitted natively!');" class="space-y-8" id="dynamic-container">
            <!-- Story Sections injected here -->
        </form>

        <div class="mt-8 pt-6 border-t border-gray-200 flex justify-end">
            <button type="submit" form="dynamic-container" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg shadow-sm font-semibold transition">
                Test Native Form Submission 🚀
            </button>
        </div>
    </div>

    <script type="module">
        import '../../index.js'; // Imports and registers ks-table-cell-content-common

        const container = document.getElementById('dynamic-container');

        const stories = [
            {
                storyNumber: "1",
                heading: "Autofocus & Auto-Focus Control Story",
                paragraph: "Automatically focuses the input element immediately upon page load without user click intervention.",
                cellValue: "",
                options: { controlType: "text", showInput: true, autofocus: true, placeholder: "I have autofocus: true enabled!", theme: "verticalStandard" }
            },
            {
                storyNumber: "2",
                heading: "Tab Navigation Exclude (tabIndex: -1)",
                paragraph: "Excludes the input control from sequential keyboard tab navigation while remaining interactive to mouse clicks.",
                cellValue: "Try pressing 'Tab' key — keyboard cursor skips over this input!",
                options: { controlType: "text", showInput: true, tabIndex: -1, theme: "verticalStandard" }
            },
            {
                storyNumber: "3",
                heading: "Native Hover Tooltip (Title Attribute)",
                paragraph: "Renders standard browser-native hover tooltips via the title attribute without extra JS libraries.",
                cellValue: "",
                options: { controlType: "text", showInput: true, title: "Native HTML browser tooltip active!", placeholder: "Hover mouse over me to see native tooltip...", theme: "verticalStandard" }
            },
            {
                storyNumber: "4",
                heading: "Spellcheck & Language Direction Story",
                paragraph: "Disables browser red squiggly spellcheck lines and sets text direction (e.g. Right-To-Left for Arabic/Hebrew).",
                cellValue: "Teh qcuik bworhn foxx (no spellcheck squiggles)",
                options: { controlType: "text", showInput: true, spellcheck: false, dir: "ltr", theme: "verticalStandard" }
            },
            {
                storyNumber: "5",
                heading: "Browser Native Minimum Length Constraint (minlength)",
                paragraph: "Enforces browser-level form validation requiring a minimum number of characters before form submission.",
                cellValue: "ab",
                options: { controlType: "text", showInput: true, minlength: 5, required: true, title: "Requires at least 5 characters!", theme: "verticalStandard" }
            }
        ];

        stories.forEach(story => {
            const card = document.createElement('div');
            card.className = "p-6 border border-gray-200 rounded-xl shadow-sm bg-white space-y-3";

            // Story Heading & Paragraph
            card.innerHTML = `
                <div class="flex items-center gap-2">
                    <span class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-full uppercase">Story ${story.storyNumber}</span>
                    <h3 class="text-lg font-bold text-gray-900">${story.heading}</h3>
                </div>
                <p class="text-sm text-gray-600 leading-relaxed">${story.paragraph}</p>
                <div class="story-component-mount pt-2"></div>
            `;

            const mountPoint = card.querySelector('.story-component-mount');
            const comp = document.createElement('ks-table-cell-content-common');
            comp.inputs = {
                cellValue: story.cellValue,
                options: story.options
            };

            mountPoint.appendChild(comp);
            container.appendChild(card);
        });
    </script>
</body>

</html>
