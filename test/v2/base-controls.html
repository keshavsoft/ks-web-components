<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Controls Test</title>
</head>
<body>
    <h2>Label Control</h2>
    <ks-web-component ks-control-type="label" ks-text="This is a test label"></ks-web-component>

    <h2>Input Control</h2>
    <ks-web-component ks-control-type="input" ks-input-type="text" ks-placeholder="Enter some text"></ks-web-component>

    <h2>Button Control</h2>
    <ks-web-component ks-control-type="button" ks-text="Click Me" ks-class-name="btn-primary"></ks-web-component>

    <script type="module" src="../../webComponents/v14/ksWebComponent.js"></script>
</body>
</html>
